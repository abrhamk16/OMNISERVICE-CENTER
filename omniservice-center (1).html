<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OMNISERVICE CENTER — One smart place for every service.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --primary:#2396FF;
  --primary-deep:#0B6FD1;
  --ink:#0F1B2D;
  --slate:#5B6B82;
  --slate-light:#8A97AB;
  --bg:#F5F8FC;
  --surface:#FFFFFF;
  --border:#E3E9F1;
  --success:#1FA97A;
  --success-bg:#E7F7F1;
  --warning:#B9791E;
  --warning-bg:#FCF2E1;
  --danger:#D6442F;
  --danger-bg:#FBEAE7;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,27,45,.04), 0 8px 24px rgba(15,27,45,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Sora',sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
::selection{background:#cfe8ff;}
.hidden{display:none !important;}
#app{min-height:100vh;}

/* ---------- layout helpers ---------- */
.container{max-width:1180px;margin:0 auto;padding:0 28px;}
.row{display:flex;}
.col{display:flex;flex-direction:column;}
.spread{justify-content:space-between;align-items:center;}
.gap-xs{gap:6px;} .gap-s{gap:10px;} .gap-m{gap:16px;} .gap-l{gap:28px;} .gap-xl{gap:44px;}
.muted{color:var(--slate);}
.small{font-size:13px;}
.center{text-align:center;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:10px;border:1px solid transparent;
  font-weight:600;font-size:14.5px;transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(35,150,255,.32);}
.btn-primary:hover{background:var(--primary-deep);}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--border);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary-deep);}
.btn-ghost{background:transparent;color:var(--slate);padding:10px 14px;}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:100px;}
.badge-verified{background:var(--success-bg);color:var(--success);}
.badge-pending{background:var(--warning-bg);color:var(--warning);}
.badge-rejected{background:var(--danger-bg);color:var(--danger);}
.badge-demo{background:#EDF1F7;color:var(--slate);}
.badge-sector{background:#E9F4FF;color:var(--primary-deep);}

/* ---------- top marketing nav ---------- */
.marketing-nav{position:sticky;top:0;z-index:50;background:rgba(245,248,252,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.marketing-nav .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sora';font-weight:700;font-size:19px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}

/* ---------- hero ---------- */
.hero{padding:64px 0 40px;}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
.eyebrow-line{color:var(--primary-deep);font-weight:700;font-size:13.5px;margin-bottom:14px;}
.hero h1{font-size:52px;line-height:1.06;margin:0 0 20px;letter-spacing:-.01em;}
.hero p.lead{font-size:18px;color:var(--slate);max-width:520px;line-height:1.55;margin-bottom:30px;}
.hero-ctas{display:flex;gap:14px;margin-bottom:10px;}
.hero-note{font-size:13px;color:var(--slate-light);margin-top:12px;}

/* live search preview card */
.preview-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px;}
.preview-topbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.preview-dot{width:9px;height:9px;border-radius:50%;background:#DCE3EC;}
.preview-label{font-size:12px;color:var(--slate-light);font-weight:600;margin-left:auto;}
.preview-input{border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:15px;min-height:24px;background:#FAFCFE;color:var(--ink);}
.preview-cursor{display:inline-block;width:2px;height:16px;background:var(--primary);vertical-align:middle;margin-left:2px;animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:0;}}
.preview-result{margin-top:14px;padding:14px;border-radius:12px;background:#F3F9FF;border:1px solid #DCEEFF;font-size:13.5px;opacity:0;transform:translateY(4px);transition:all .3s ease;}
.preview-result.show{opacity:1;transform:translateY(0);}
.preview-result b{color:var(--primary-deep);}
.preview-providers{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.preview-chip{font-size:12px;background:#fff;border:1px solid var(--border);padding:6px 10px;border-radius:100px;color:var(--slate);}

/* ---------- sections ---------- */
.section{padding:72px 0;border-top:1px solid var(--border);}
.section-head{max-width:620px;margin-bottom:40px;}
.section-tag{color:var(--primary-deep);font-weight:700;font-size:13px;margin-bottom:10px;}
.section h2{font-size:32px;margin:0 0 12px;letter-spacing:-.01em;}
.section p.desc{color:var(--slate);font-size:16px;line-height:1.6;}

.sector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.sector-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;transition:transform .15s ease, box-shadow .15s ease, border-color .15s;}
.sector-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfe3fb;}
.sector-icon{width:44px;height:44px;border-radius:11px;background:#EAF5FF;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px;}
.sector-card h4{margin:0 0 4px;font-size:15px;}
.sector-card p{margin:0;font-size:12.5px;color:var(--slate);}

.step-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.step{border-left:2px solid var(--border);padding-left:16px;}
.step .num{font-family:'Sora';font-weight:700;color:var(--primary);font-size:13px;margin-bottom:8px;}
.step h4{margin:0 0 6px;font-size:15.5px;}
.step p{margin:0;color:var(--slate);font-size:13.5px;line-height:1.5;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.info-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:26px;}
.info-card h3{margin:0 0 10px;font-size:19px;}
.info-card p{margin:0;color:var(--slate);font-size:14.5px;line-height:1.6;}
.check-list{margin:16px 0 0;padding:0;list-style:none;}
.check-list li{display:flex;gap:10px;font-size:14px;color:var(--ink);margin-bottom:10px;align-items:flex-start;}
.check-list li:before{content:"✓";color:var(--success);font-weight:700;}

.footer{padding:48px 0;border-top:1px solid var(--border);}
.footer-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-links{display:flex;gap:22px;font-size:13.5px;color:var(--slate);}
.footer-links a:hover{color:var(--primary-deep);}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal h3{margin:0 0 6px;font-size:20px;}
.modal-close{position:absolute;top:20px;right:20px;}
.modal-wrap{position:relative;}

/* ---------- forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
.field-hint{font-size:12px;color:var(--slate-light);margin-top:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ---------- app shell (seeker/provider/admin) ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar .brand{padding:8px 8px 20px;cursor:pointer;font-size:16px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.sidebar-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--slate);}
.sidebar-link:hover{background:#F3F7FC;color:var(--ink);}
.sidebar-link.active{background:#E9F4FF;color:var(--primary-deep);}
.sidebar-icon{width:18px;text-align:center;}
.sidebar-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-light);font-weight:700;margin:18px 0 6px 12px;}
.sidebar-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;}
.role-pill{font-size:11px;background:#F3F7FC;color:var(--slate);padding:5px 9px;border-radius:100px;display:inline-block;margin-bottom:8px;}

.main{flex:1;min-width:0;padding:28px 34px 60px;}
.main-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;gap:16px;flex-wrap:wrap;}
.main-head h1{font-size:25px;margin:0 0 6px;}
.main-head p{margin:0;color:var(--slate);font-size:14px;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;}
.stat-card .val{font-family:'Sora';font-size:26px;font-weight:700;}
.stat-card .lbl{font-size:12.5px;color:var(--slate);margin-top:4px;}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;}
.card + .card{margin-top:12px;}

.tab-bar{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;background:none;border-radius:0;}
.tab-btn.active{color:var(--primary-deep);border-color:var(--primary);}

/* provider cards */
.provider-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s, border-color .15s;}
.provider-card:hover{box-shadow:var(--shadow);border-color:#cfe3fb;}
.provider-card.highlighted{border-color:var(--primary);box-shadow:0 0 0 3px rgba(35,150,255,.14);}
.provider-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.provider-name{font-weight:700;font-size:15.5px;}
.provider-meta{font-size:12.5px;color:var(--slate);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.provider-desc{font-size:13.5px;color:var(--slate);line-height:1.5;}
.provider-actions{display:flex;gap:8px;margin-top:4px;}

.req-item{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.req-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:100px;}
.status-New{background:#E9F4FF;color:var(--primary-deep);}
.status-Viewed{background:#F0F0FA;color:#5B57C7;}
.status-Accepted{background:var(--success-bg);color:var(--success);}
.status-Rejected{background:var(--danger-bg);color:var(--danger);}
.status-In-Progress{background:var(--warning-bg);color:var(--warning);}
.status-Completed{background:#E7F7F1;color:#12805E;}
.status-Cancelled{background:#EDF1F7;color:var(--slate);}
.timeline{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
.timeline-item{font-size:12.5px;color:var(--slate);display:flex;gap:8px;margin-bottom:5px;}
.timeline-item .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}

/* AI chat */
.ai-shell{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start;}
.chat-window{background:#fff;border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;height:70vh;}
.chat-log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.msg{max-width:78%;padding:12px 15px;border-radius:14px;font-size:14px;line-height:1.5;}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:#F3F7FC;color:var(--ink);border-bottom-left-radius:4px;}
.msg.ai .tag{font-size:11px;font-weight:700;color:var(--primary-deep);display:block;margin-bottom:4px;}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 15px;}
.typing span{width:6px;height:6px;background:var(--slate-light);border-radius:50%;animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
.chat-input-row{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);}
.chat-input-row input{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;}
.chat-suggestions{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap;}
.suggestion-chip{font-size:12.5px;background:#F3F7FC;border:1px solid var(--border);padding:7px 12px;border-radius:100px;color:var(--slate);}
.suggestion-chip:hover{border-color:var(--primary);color:var(--primary-deep);}
.ai-side-panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;max-height:70vh;overflow-y:auto;}

/* map */
.map-shell{display:grid;grid-template-columns:300px 1fr;gap:16px;height:74vh;}
#leaflet-map, .leaflet-map-el{width:100%;height:100%;border-radius:14px;border:1px solid var(--border);}
.map-filters{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;overflow-y:auto;}
.filter-chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.filter-chip{font-size:12px;padding:6px 10px;border-radius:100px;border:1px solid var(--border);background:#fff;color:var(--slate);}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.toast-root{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--ink);color:#fff;padding:13px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.demo-switcher{position:fixed;bottom:18px;left:18px;background:#0F1B2D;color:#fff;border-radius:14px;padding:12px 14px;font-size:12.5px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:250px;}
.demo-switcher b{display:block;margin-bottom:8px;font-size:12px;color:#9FCBFF;}
.demo-switcher .row{gap:6px;flex-wrap:wrap;}
.demo-switcher button{background:#1C2C42;color:#fff;border:1px solid #2C3F58;padding:6px 9px;border-radius:8px;font-size:11.5px;}
.demo-switcher button.on{background:var(--primary);border-color:var(--primary);}
.demo-switcher .close-x{position:absolute;top:8px;right:10px;color:#8A97AB;cursor:pointer;font-size:14px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--slate);}
.empty-state .ico{font-size:34px;margin-bottom:10px;}

.avatar-circle{width:34px;height:34px;border-radius:9px;background:#EAF5FF;color:var(--primary-deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}

table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.admin-table th{text-align:left;color:var(--slate);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
table.admin-table td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
table.admin-table tr:last-child td{border-bottom:none;}

.rating-stars{color:#E2A93B;font-size:13px;letter-spacing:1px;}

.info-banner{background:#F3F9FF;border:1px solid #DCEEFF;border-radius:12px;padding:13px 16px;font-size:13px;color:var(--slate);margin-bottom:16px;}

@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;}
  .sector-grid{grid-template-columns:repeat(2,1fr);}
  .step-row{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .ai-shell{grid-template-columns:1fr;}
  .map-shell{grid-template-columns:1fr;height:auto;}
  #leaflet-map, .leaflet-map-el{height:420px;}
  .app-shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}
  .sidebar-nav{flex-direction:row;}
  .sidebar-section-title{display:none;}
  .main{padding:22px 16px 60px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
/* =====================================================================
   OMNISERVICE CENTER — working prototype
   Client-side SPA. "Backend" = shared persistent artifact storage.
   OMNI AI = deterministic keyword/synonym engine + Claude API fallback.
   Map = real Leaflet + OpenStreetMap.
   ===================================================================== */

/* ---------------------------- DATA CATALOG ---------------------------- */
const SECTORS = [
  {id:'it', name:'IT & Technology', icon:'💻', desc:'Repairs, networks, software & web development'},
  {id:'transport', name:'Transportation', icon:'🚗', desc:'Taxis, transfers, rentals & vehicle repair'},
  {id:'telecom', name:'Telecommunications', icon:'📶', desc:'Internet, SIM & connectivity services'},
  {id:'gov', name:'Government Services', icon:'🏛️', desc:'IDs, permits & public registration help'},
  {id:'education', name:'Education', icon:'🎓', desc:'Tutoring, exam prep & tech training'},
  {id:'health', name:'Healthcare', icon:'🏥', desc:'Clinics, pharmacies & dental care'},
  {id:'realestate', name:'Real Estate', icon:'🏠', desc:'Renting, moving & property management'},
  {id:'business', name:'Business & Consulting', icon:'💼', desc:'Legal, accounting & business advice'},
  {id:'shopping', name:'Shopping & Supermarkets', icon:'🛒', desc:'Groceries, delivery & retail'},
  {id:'agriculture', name:'Agriculture', icon:'🌾', desc:'Farm inputs, equipment & veterinary care'},
  {id:'events', name:'Events & Media', icon:'🎬', desc:'Planning, catering & production'},
  {id:'ngo', name:'NGOs & Community Services', icon:'🤝', desc:'Community programs & social support'},
];

const SERVICES = [
  {id:'it-computer-repair', sectorId:'it', name:'Computer & Laptop Repair', keywords:['computer','laptop','pc','desktop','monitor','keyboard','won\'t start','wont start','not working','virus','slow computer','windows','boot','screen frozen','blue screen']},
  {id:'it-phone-repair', sectorId:'it', name:'Phone & Device Repair', keywords:['phone','mobile','smartphone','cracked screen','charging port','battery','android','iphone','display broken','touch screen']},
  {id:'it-networking', sectorId:'it', name:'Networking & Wi-Fi Setup', keywords:['wifi','wi-fi','network','router','internet not working','lan','networking','no internet']},
  {id:'it-web-dev', sectorId:'it', name:'Web & Software Development', keywords:['website','web app','software developer','app development','build a website','build an app','online store']},
  {id:'it-software-install', sectorId:'it', name:'Software Install & Data Recovery', keywords:['install software','data recovery','lost files','recover data','reinstall windows','deleted files']},
  {id:'transport-taxi', sectorId:'transport', name:'Local Taxi & Ride', keywords:['taxi','ride','need a ride','pick me up','drop me','get around town','local transport']},
  {id:'transport-airport', sectorId:'transport', name:'Airport Transfer', keywords:['airport','flight','pick up from airport','airport transfer','catch a flight']},
  {id:'transport-carrental', sectorId:'transport', name:'Car Rental', keywords:['rent a car','car rental','hire a car','rental vehicle']},

/* ---------------------------- UTIL ---------------------------- */
function haversine(a,b){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function fmtKm(km){ return km<1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km'; }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function esc(str){ return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }

function getSeekerLocation(){
  return new Promise(resolve=>{
    if(state._geoResult){ resolve(state._geoResult); return; }
    if(!navigator.geolocation){ state._geoResult={lat:GONDAR_CENTER.lat,lng:GONDAR_CENTER.lng,approx:true}; resolve(state._geoResult); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ state._geoResult={lat:pos.coords.latitude,lng:pos.coords.longitude,approx:false}; resolve(state._geoResult); },
      ()=>{ state._geoResult={lat:GONDAR_CENTER.lat,lng:GONDAR_CENTER.lng,approx:true}; resolve(state._geoResult); },
      {timeout:4000}
    );
  });
}

function providerAvgRating(providerId){
  const rs = DB.reviews.filter(r=>r.providerId===providerId && r.moderation==='approved');
  if(!rs.length) return null;
  return rs.reduce((a,r)=>a+r.rating,0)/rs.length;
}
function starString(avg){
  if(avg==null) return null;
  const full = Math.round(avg);
  return '★★★★★☆☆☆☆☆'.slice(5-full,10-full);
}

function rankProviders(candidates, seekerLoc){
  return candidates.map(p=>{
    const dist = seekerLoc ? haversine(seekerLoc,{lat:p.lat,lng:p.lng}) : null;
    const avg = providerAvgRating(p.id);
    let score = 0;
    if(p.verification==='Verified') score += 3;
    if(avg!=null) score += avg;
    if(dist!=null) score -= Math.min(dist*0.15, 3);
    return {...p, _dist:dist, _avg:avg, _score:score};
  }).sort((a,b)=>b._score-a._score);
}

/* ---------------------------- OMNI AI ENGINE ---------------------------- */
function keywordMatch(text){
  const t = text.toLowerCase();
  const scored = SERVICES.map(s=>{
    let score = 0;
    s.keywords.forEach(k=>{ if(t.includes(k)) score += k.split(' ').length; });
    return {service:s, score};
  }).filter(s=>s.score>0).sort((a,b)=>b.score-a.score);
  return scored;
}

async function claudeFallback(text){
  const catalog = SERVICES.map(s=>`${s.id}: ${s.name} (sector: ${sectorOf(s.sectorId).name})`).join('\n');
  const sys = `You are OMNI AI, a service-intent classifier for OMNISERVICE CENTER, a service-discovery platform in Gondar, Ethiopia. Given a user's natural-language message, pick the single best matching service from this exact catalog (use the id exactly as written), or return null if nothing fits well or the message is unrelated to finding a service. Respond with ONLY raw JSON, no markdown fences, no commentary, in this exact shape:
{"serviceId": "<id-from-catalog-or-null>", "reply": "<one short, warm sentence, under 25 words, describing what you understood>", "clarifyingQuestion": "<a short clarifying question, or null if confident>"}

Catalog:
${catalog}`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:300,
        system: sys,
        messages:[{role:"user", content:text}]
      })
    });
    const data = await response.json();
    const raw = (data.content||[]).map(b=>b.text||'').join('').trim();
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(parsed.serviceId && !svc(parsed.serviceId)) parsed.serviceId = null; // never trust an invented id
    return {ok:true, ...parsed};
  }catch(e){
    return {ok:false, serviceId:null, reply:"I'm having trouble reaching the language model right now, so I'll rely on keyword matching only.", clarifyingQuestion:"Could you tell me, in a few words, what kind of help you need?"};
  }
}

/* main entry: returns a result object the chat UI renders */
async function omniAIProcess(text){
  const matches = keywordMatch(text);
  if(matches.length && (matches.length===1 || matches[0].score > matches[1].score)){
    return { mode:'keyword', service: matches[0].service, reply:null };
  }
  if(matches.length >= 2 && matches[0].score === matches[1].score){
    const opts = matches.slice(0,3).map(m=>m.service.name).join(', ');
    return { mode:'clarify-tie', options: matches.slice(0,3).map(m=>m.service), reply:`I found a couple of possible matches — ${opts}. Which one fits best?` };
  }
  const llm = await claudeFallback(text);
  if(llm.serviceId){
    return { mode:'llm', service: svc(llm.serviceId), reply: llm.reply };
  }
  return { mode:'clarify-llm', reply: llm.reply || "I'm not fully sure what you need yet.", question: llm.clarifyingQuestion || "Could you describe the problem in a bit more detail?" };
}

function startHeroTyping(){
  const target = document.getElementById('heroTypeTarget');
  const resultEl = document.getElementById('heroResult');
  if(!target) return;
  const phrases = ["My laptop won't turn on…", "I need a tutor for my son…", "Find a verified dentist nearby…"];
  let pi=0, ci=0, deleting=false;
  clearInterval(state._heroTimer);
  function tick(){
    const phrase = phrases[pi];
    if(!deleting){
      ci++;
      target.innerHTML = esc(phrase.slice(0,ci)) + '<span class="preview-cursor"></span>';
      if(ci===phrase.length){
        resultEl && resultEl.classList.add('show');
        deleting=true; setTimeout(tick, 1600); return;
      }
    } else {
      resultEl && resultEl.classList.remove('show');
      ci--;
      target.innerHTML = esc(phrase.slice(0,ci)) + '<span class="preview-cursor"></span>';
      if(ci===0){ deleting=false; pi=(pi+1)%phrases.length; }
    }
    state._heroTimer = setTimeout(tick, deleting?35:65);
  }
  tick();
}

function requestDetailCard(r, viewer){
  const p = DB.providers.find(x=>x.id===r.providerId);
  const s = svc(r.serviceId);
  const alreadyReviewed = DB.reviews.some(rv=>rv.requestId===r.id);
  return `
  <div class="req-item">
    <div class="req-top">
      <div><b>${esc(s?s.name:'Service')}</b><div class="small muted">${esc(p?p.name:'')}${r.urgency?' · '+r.urgency:''}</div></div>
      <span class="status-pill status-${r.status.replace(' ','-')}">${r.status}</span>
    </div>
    <div class="small" style="margin-top:8px;">${esc(r.description)}</div>
    ${viewer==='provider' ? `
    <div class="row gap-s" style="margin-top:12px;flex-wrap:wrap;">
      ${r.status==='New'?`<button class="btn btn-secondary btn-sm" data-action="setReqStatus" data-req="${r.id}" data-status="Viewed">Mark viewed</button>`:''}
      ${['New','Viewed'].includes(r.status)?`<button class="btn btn-success btn-sm" data-action="setReqStatus" data-req="${r.id}" data-status="Accepted">Accept</button><button class="btn btn-danger btn-sm" data-action="setReqStatus" data-req="${r.id}" data-status="Rejected">Decline</button>`:''}
      ${r.status==='Accepted'?`<button class="btn btn-secondary btn-sm" data-action="setReqStatus" data-req="${r.id}" data-status="In Progress">Start work</button>`:''}
      ${r.status==='In Progress'?`<button class="btn btn-success btn-sm" data-action="setReqStatus" data-req="${r.id}" data-status="Completed">Mark completed</button>`:''}
      ${!['Completed','Rejected','Cancelled'].includes(r.status)?`<button class="btn btn-ghost btn-sm" data-action="setReqStatus" data-req="${r.id}" data-status="Cancelled">Cancel</button>`:''}
    </div>` : ''}
    ${viewer==='seeker' && r.status==='Completed' && !alreadyReviewed ? `<button class="btn btn-secondary btn-sm" style="margin-top:10px;" data-action="openReviewForm" data-req="${r.id}">Leave a review</button>` : ''}
    <div class="timeline">
      ${r.events.map(e=>`<div class="timeline-item"><span class="dot"></span><span>${esc(e.status)} · ${fmtDate(e.ts)}${e.note?' — '+esc(e.note):''}</span></div>`).join('')}
    </div>
  </div>`;
}

  <b class="small muted">Pending approval</b>
  <div style="margin:10px 0 24px;">
  ${pending.length? pending.map(d=>{
    const p = DB.providers.find(x=>x.id===d.providerId);
    return `<div class="card"><div class="row spread"><b>${esc(d.title)}</b><span class="badge badge-pending">Pending</span></div>
    <div class="small muted" style="margin:6px 0;">${esc(p?p.name:'')}</div><div class="small">${esc(d.description)}</div>
    <div class="row gap-s" style="margin-top:12px;"><button class="btn btn-success btn-sm" data-action="setDealStatus" data-deal="${d.id}" data-status="Approved">Approve</button><button class="btn btn-danger btn-sm" data-action="setDealStatus" data-deal="${d.id}" data-status="Rejected">Reject</button></div></div>`;

  </div>

  ${others.map(d=>`<div class="card"><div class="row spread"><b>${esc(d.title)}</b><span class="badge ${d.status==='Approved'?'badge-verified':'badge-rejected'}">${d.status}</span></div></div>`).join('') || '<div class="small muted">—</div>'}

/* ---------------------------- LEAFLET MAP ---------------------------- */
let leafletMap = null, leafletMarkers = [];
async function initLeafletMap(){
  const el = document.getElementById('leaflet-map');
  if(!el || typeof L==='undefined') return;
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map(el).setView([GONDAR_CENTER.lat, GONDAR_CENTER.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19
  }).addTo(leafletMap);
  paintMarkers();
}
function paintMarkers(){
  if(!leafletMap) return;
  leafletMarkers.forEach(m=>leafletMap.removeLayer(m));
  leafletMarkers = [];
  const filter = state.sub.mapSectorFilter;
  const list = filter ? DB.providers.filter(p=>p.sectorId===filter) : DB.providers;
  list.forEach(p=>{
    const isHighlighted = state.sub.highlightProvider===p.id;
    const color = isHighlighted ? '#0B6FD1' : (p.verification==='Verified' ? '#2396FF' : '#B9791E');
    const icon = L.divIcon({
      className:'', html:`<div style="width:${isHighlighted?20:14}px;height:${isHighlighted?20:14}px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);"></div>`,
      iconSize:[isHighlighted?20:14, isHighlighted?20:14], iconAnchor:[isHighlighted?10:7, isHighlighted?10:7]
    });
    const marker = L.marker([p.lat, p.lng], {icon}).addTo(leafletMap);
    marker.bindPopup(`<b>${esc(p.name)}</b><br><span style="font-size:12px;color:#5B6B82;">${sectorOf(p.sectorId).name} · ${p.verification}</span><br><a href="#" onclick="window.__openProviderFromMap('${p.id}');return false;" style="font-size:12px;">View details →</a>`);
    leafletMarkers.push(marker);
  });
  if(state.sub.highlightProvider){
    const hp = DB.providers.find(p=>p.id===state.sub.highlightProvider);
    if(hp) leafletMap.setView([hp.lat, hp.lng], 15);
  }
}
window.__openProviderFromMap = function(id){ openProviderModal(id); };

/* ---------------------------- EVENT HANDLERS ---------------------------- */
function openProviderModal(id){
  state.sub.modal = {type:'providerDetail', providerId:id};
  render();
}
function closeModal(){ state.sub.modal = null; render(); }

async function afterRender(){
  if(state.view==='landing') startHeroTyping();
  if(state.view==='providerOnboard') wireProviderOnboardServiceSelect();
  if(document.getElementById('leaflet-map')) await initLeafletMap();
  wireForms();
}

function wireProviderOnboardServiceSelect(){
  const sectorSel = document.querySelector('select[name="sectorId"]');
  const svcSel = document.getElementById('providerServiceSelect');
  function refresh(){
    const services = SERVICES.filter(s=>s.sectorId===sectorSel.value);
    svcSel.innerHTML = services.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  }
  sectorSel.addEventListener('change', refresh);
  refresh();
}

function wireForms(){
  document.querySelectorAll('form[data-form]').forEach(f=>{
    f.addEventListener('submit', handleFormSubmit);
  });
}

async function handleFormSubmit(e){
  e.preventDefault();
  const form = e.currentTarget;
  const type = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());

  if(type==='seekerOnboard'){
    const seeker = {id:uid('seeker'), name:data.name, contact:data.contact, location:data.location||'Gondar', createdAt:nowISO()};
    DB.seekers.push(seeker);
    SESSION = {role:'seeker', seekerId:seeker.id, providerId:null, isAdmin:false};
    log(`New seeker registered: ${seeker.name}`);
    await saveDB(); await saveSession();
    toast('Welcome, '+seeker.name.split(' ')[0]+'!');
    state.view='seeker'; state.seekerNav='home'; render();
  }
  else if(type==='providerOnboard'){
    const provider = {
      id:uid('prov'), name:data.name, sectorId:data.sectorId, serviceIds:[data.serviceId],
      lat: GONDAR_CENTER.lat + (Math.random()-0.5)*0.03, lng: GONDAR_CENTER.lng + (Math.random()-0.5)*0.03,
      address:data.address, phone:data.phone, hours:data.hours||'By appointment', priceInfo:data.priceInfo||'Price on request',
      desc:data.desc, verification:'Pending', createdAt:nowISO()
    };
    DB.providers.push(provider);
    SESSION = {role:'provider', seekerId:null, providerId:provider.id, isAdmin:false};
    log(`New provider submitted for verification: ${provider.name}`);
    await saveDB(); await saveSession();
    toast('Profile submitted — pending verification.');
    state.view='provider'; state.providerNav='dashboard'; render();
  }
  else if(type==='adminLogin'){
    if((data.passcode||'').trim().toUpperCase()==='DEMO'){
      SESSION = {role:null, seekerId:SESSION.seekerId, providerId:SESSION.providerId, isAdmin:true};
      await saveSession();
      toast('Welcome, Administrator.');
      state.view='admin'; state.adminNav='dashboard'; render();
    } else {
      toast('Incorrect passcode. Try "DEMO".');
    }
  }
  else if(type==='createRequest'){
    const providerId = form.dataset.provider;
    const seeker = currentSeeker();
    if(!seeker){ toast('Please sign in as a Seeker first.'); return; }
    const request = {
      id:uid('req'), seekerId:seeker.id, providerId, serviceId:data.serviceId,
      description:data.description, urgency:data.urgency, preferredTime:data.preferredTime||'',
      location:data.location||seeker.location, status:'New', createdAt:nowISO(),
      events:[{status:'New', ts:nowISO(), note:'Request submitted by seeker'}]
    };
    DB.requests.push(request);
    log(`Request created for ${svc(data.serviceId)?.name} → ${DB.providers.find(p=>p.id===providerId)?.name}`);
    await saveDB();
    toast('Request sent!');
    state.sub.modal=null;
    state.seekerNav='requests';
    render();
  }
  else if(type==='createReview'){
    const requestId = form.dataset.request;
    const req = DB.requests.find(r=>r.id===requestId);
    const review = {id:uid('rev'), requestId, providerId:req.providerId, seekerId:req.seekerId, rating:parseInt(data.rating,10), comment:data.comment, moderation:'pending', createdAt:nowISO()};
    DB.reviews.push(review);
    log(`New review submitted for ${DB.providers.find(p=>p.id===req.providerId)?.name}`);
    await saveDB();
    toast('Review submitted for moderation.');
    state.sub.modal=null;
    render();
  }
  else if(type==='createDeal'){
    const p = currentProvider();
    const deal = {id:uid('deal'), providerId:p.id, title:data.title, serviceId:data.serviceId, description:data.description, startAt:data.startAt, endAt:data.endAt, terms:data.terms||'', status:'Pending', createdAt:nowISO()};
    DB.deals.push(deal);
    log(`New deal submitted: ${deal.title}`);
    await saveDB();
    toast('Deal submitted for approval.');
    state.sub.modal=null;
    render();
  }
  else if(type==='chatSend'){
    const text = data.text.trim();
    if(!text) return;
    form.reset();
    await handleChatMessage(text);
  }
}

async function handleChatMessage(text){
  state.sub.chat.push({who:'user', text});
  state.sub.aiThinking = true;
  render();
  scrollChatToBottom();

  const result = await omniAIProcess(text);
  state.sub.aiThinking = false;

  if(result.mode==='keyword' || result.mode==='llm'){
    const s = result.service;
    const loc = await getSeekerLocation();
    const providers = rankProviders(DB.providers.filter(p=>p.serviceIds.includes(s.id)), loc);
    state.sub.aiProviders = providers;
    const tag = result.mode==='keyword' ? 'Matched instantly · keyword engine' : 'Understood via language model';
    const reply = result.reply || `It sounds like you need ${s.name}. I found ${providers.length} provider${providers.length===1?'':'s'} nearby.`;
    state.sub.chat.push({who:'ai', tag, text: reply});
    if(providers.length){
      state.sub.highlightProvider = providers[0].id;
    }
  } else if(result.mode==='clarify-tie'){
    state.sub.chat.push({who:'ai', tag:'Needs clarification', text: result.reply});
  } else {
    state.sub.chat.push({who:'ai', tag:'Needs clarification', text: (result.reply||'') + ' ' + (result.question||'')});
  }
  render();
  scrollChatToBottom();
}
function scrollChatToBottom(){
  requestAnimationFrame(()=>{ const log=document.getElementById('chatLog'); if(log) log.scrollTop = log.scrollHeight; });
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='go'){ state.view = el.dataset.view; state.sub={}; render(); }
  else if(action==='scrollTo'){ const t=document.getElementById(el.dataset.target); t && t.scrollIntoView({behavior:'smooth'}); }
  else if(action==='openAbout'){ state.sub.modal={type:'about'}; render(); }
  else if(action==='closeModal'){ closeModal(); }
  else if(action==='logout'){ SESSION={role:null,seekerId:null,providerId:null,isAdmin:false}; await saveSession(); state.view='landing'; state.sub={}; render(); }

  else if(action==='seekerNav'){ state.seekerNav = el.dataset.nav; state.sub.selectedSector=null; state.sub.selectedService=null; render(); }
  else if(action==='providerNav'){ state.providerNav = el.dataset.nav; render(); }
  else if(action==='adminNav'){ state.adminNav = el.dataset.nav; render(); }

  else if(action==='openSector'){ state.seekerNav='services'; state.sub.selectedSector=el.dataset.sector; state.sub.selectedService=null; render(); }
  else if(action==='openService'){ state.seekerNav='services'; state.sub.selectedService=el.dataset.service; render(); }
  else if(action==='openProvider'){ openProviderModal(el.dataset.provider); }
  else if(action==='openRequestForm'){ state.sub.modal={type:'requestForm', providerId:el.dataset.provider}; render(); }
  else if(action==='openReviewForm'){ state.sub.modal={type:'reviewForm', requestId:el.dataset.req}; render(); }
  else if(action==='openDealForm'){ state.sub.modal={type:'dealForm'}; render(); }

  else if(action==='homeAISubmit'){
    const input = document.getElementById('homeAIInput');
    const text = input.value.trim();
    if(!text) return;
    state.seekerNav='ai';
    state.sub.chat = [{who:'ai', text:"Hi — I'm OMNI AI. Tell me what you need help with, in your own words."}];
    render();
    await handleChatMessage(text);
  }
  else if(action==='chatSuggest'){
    document.querySelector('input[name="text"]').value = el.dataset.text;
    await handleChatMessage(el.dataset.text);
  }

  else if(action==='mapFilterSector'){ state.sub.mapSectorFilter = el.dataset.sector || null; render(); }
  else if(action==='focusOnMap'){ state.sub.highlightProvider = el.dataset.provider; state.sub.modal=null; state.seekerNav='map'; render(); }

  else if(action==='setReqStatus'){
    const r = DB.requests.find(x=>x.id===el.dataset.req);
    r.status = el.dataset.status;
    r.events.push({status:el.dataset.status, ts:nowISO(), note:''});
    log(`Request ${r.id} status → ${el.dataset.status}`);
    await saveDB(); toast('Status updated: '+el.dataset.status); render();
  }
  else if(action==='verifyProvider'){
    const p = DB.providers.find(x=>x.id===el.dataset.provider);
    p.verification = el.dataset.status;
    log(`Provider "${p.name}" set to ${el.dataset.status}`);
    await saveDB(); toast(p.name+' → '+el.dataset.status); render();
  }
  else if(action==='setDealStatus'){
    const d = DB.deals.find(x=>x.id===el.dataset.deal);
    d.status = el.dataset.status;
    log(`Deal "${d.title}" → ${el.dataset.status}`);
    await saveDB(); toast('Deal '+el.dataset.status.toLowerCase()); render();
  }
  else if(action==='modReview'){
    const r = DB.reviews.find(x=>x.id===el.dataset.review);
    r.moderation = el.dataset.status;
    log(`Review moderated: ${el.dataset.status}`);
    await saveDB(); toast('Review '+el.dataset.status); render();
  }

  else if(action==='quickRole'){
    const role = el.dataset.role;
    if(role==='seeker'){
      if(!currentSeeker()){ state.view='seekerOnboard'; }
      else { SESSION.role='seeker'; await saveSession(); state.view='seeker'; state.seekerNav='home'; }
    } else if(role==='provider'){
      if(!currentProvider()){ state.view='providerOnboard'; }
      else { SESSION.role='provider'; await saveSession(); state.view='provider'; state.providerNav='dashboard'; }
    } else if(role==='admin'){
      if(!SESSION.isAdmin){ state.view='adminLogin'; }
      else { state.view='admin'; state.adminNav='dashboard'; }
    }
    state.sub={};
    render();
  }
  else if(action==='hideDemoSwitcher'){ state.showDemoSwitcher=false; render(); }
});

/* ---------------------------- BOOT ---------------------------- */
(async function boot(){
  await loadDB();
  await loadSession();
  if(SESSION.isAdmin){ state.view='admin'; }
  else if(SESSION.role==='provider' && SESSION.providerId){ state.view='provider'; }
  else if(SESSION.role==='seeker' && SESSION.seekerId){ state.view='seeker'; }
  render();
})();
</script>
