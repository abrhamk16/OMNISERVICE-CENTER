<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — My Requests</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .tabs{display:flex; gap:.5rem; margin:1.2rem 0 1.6rem; border-bottom:1px solid var(--mist-line);}
  .tabs button{background:none; border:none; padding:.8rem 1.1rem; font-weight:600; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--violet-700); border-color:var(--violet-600);}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap section-tight">
  <h1 data-i18n="myRequests.title"></h1>
  <div class="tabs">
    <button data-tab="requests" class="active" data-i18n="myRequests.requestsTab"></button>
    <button data-tab="tasks" data-i18n="myRequests.tasksTab"></button>
  </div>
  <div id="tab-content"></div>
</div>
<div id="site-footer"></div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('CUSTOMER');
  if(user){
    EDELALA.renderHeader('customer'); EDELALA.renderFooter();
    let tab = 'requests';

    function statusBadge(status){
      const cls = { NEW:'badge-neutral', CONTACTED:'badge-pending', IN_PROGRESS:'badge-pending', COMPLETED:'badge-verified', CANCELLED:'badge-alert' }[status] || 'badge-neutral';
      return `<span class="badge ${cls}">${I18N.t('request.status.'+status)}</span>`;
    }

    function renderRequests(){
      const items = DB.requestsByCustomer(user.id);
      if(!items.length) return `<div class="empty-state"><div class="icon">📨</div><p data-i18n="myRequests.empty"></p></div>`;
      return `<div class="table-wrap"><table><thead><tr>
        <th data-i18n="listing.postedBy"></th><th data-i18n="request.preferredTime"></th><th>Status</th><th></th>
      </tr></thead><tbody>
      ${items.map(r=>`<tr>
        <td>${r.listing ? EDELALA.escapeHtml(r.listing.title) : I18N.t('common.na')}</td>
        <td>${EDELALA.escapeHtml(r.preferredTime||'—')}</td>
        <td>${statusBadge(r.status)}</td>
        <td>${r.listing ? `<a class="btn btn-ghost btn-sm" href="listing.html?id=${r.listing.id}">→</a>` : ''}</td>
      </tr>`).join('')}
      </tbody></table></div>`;
    }
    function renderTasks(){
      const items = DB.tasksByCustomer(user.id);
      if(!items.length) return `<div class="empty-state"><div class="icon">📋</div><p data-i18n="myRequests.empty"></p></div>`;
      return `<div class="table-wrap"><table><thead><tr>
        <th data-i18n="task.category"></th><th data-i18n="task.budget"></th><th data-i18n="task.deadline"></th><th>Status</th>
      </tr></thead><tbody>
      ${items.map(t=>`<tr>
        <td>${EDELALA.categoryIcon(t.category)} ${EDELALA.categoryLabel(t.category)}</td>
        <td>${EDELALA.formatETB(t.budget)}</td>
        <td>${EDELALA.escapeHtml(t.deadline||'—')}</td>
        <td>${statusBadge(t.status)}</td>
      </tr>`).join('')}
      </tbody></table></div>`;
    }
    function refresh(){
      document.getElementById('tab-content').innerHTML = tab==='requests' ? renderRequests() : renderTasks();
      I18N.applyTranslations();
    }
    document.querySelectorAll('.tabs button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b===btn));
        refresh();
      });
    });
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
