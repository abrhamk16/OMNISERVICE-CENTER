<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
</head>
<body>
<div id="site-header"></div>
<div class="auth-shell">
  <div class="auth-card">
    <h2 data-i18n="auth.login.title"></h2>
    <p class="text-soft" data-i18n="auth.login.subtitle" style="margin-bottom:1.2rem;"></p>
    <div class="auth-success" id="signup-success" data-i18n="auth.signupSuccess"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label data-i18n="auth.email"></label>
        <input type="email" id="email" required autocomplete="email">
        <div class="error" data-i18n="common.invalidEmail"></div>
      </div>
      <div class="field">
        <label data-i18n="auth.password"></label>
        <input type="password" id="password" required autocomplete="current-password">
        <div class="error" data-i18n="common.required"></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="nav.login"></button>
    </form>
    <p style="margin-top:1.2rem;text-align:center;font-size:.9rem;">
      <span data-i18n="auth.noAccount"></span>
      <a href="register.html" style="color:var(--violet-700);font-weight:600;text-decoration:none;" data-i18n="nav.register"></a>
    </p>
    <p style="text-align:center;"><a href="../index.html" class="text-soft" style="font-size:.85rem;" data-i18n="common.backHome"></a></p>
  </div>
</div>
<div id="site-footer"></div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  EDELALA.renderHeader('customer');
  EDELALA.renderFooter();
  EDELALA.setupLogin('CUSTOMER', {
    redirect: '../index.html',
    welcome: function(u){ return 'Welcome back, ' + u.fullName.split(' ')[0] + '!'; }
  });
</script>
</body>
</html>
