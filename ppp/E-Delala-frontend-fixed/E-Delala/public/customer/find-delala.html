<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Find a Delala</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .fd-filters{display:flex; gap:.8rem; flex-wrap:wrap; margin:1.4rem 0 1.8rem; align-items:flex-end;}
  .fd-filters .field{margin-bottom:0; min-width:170px;}
  .agent-list{display:grid; grid-template-columns:repeat(3,1fr); gap:1.4rem;}
  .agent-tile{border:1px solid var(--mist-line); border-radius:var(--radius-m); padding:1.4rem;}
  .agent-tile .top{display:flex; gap:1rem; align-items:center; margin-bottom:.8rem;}
  .agent-tile img{width:64px;height:64px;border-radius:50%;object-fit:cover;}
  .agent-tile .stats{display:flex; gap:1.2rem; font-size:.82rem; color:var(--ink-soft); margin:.6rem 0;}
  @media (max-width:900px){ .agent-list{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .agent-list{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap section-tight">
  <h1 data-i18n="findDelala.title"></h1>
  <p class="text-soft" data-i18n="findDelala.subtitle"></p>
  <div class="fd-filters">
    <div class="field"><input type="text" id="fd-q" data-i18n-placeholder="findDelala.searchPlaceholder"></div>
    <div class="field">
      <select id="fd-city"><option value="" data-i18n="filter.all"></option></select>
    </div>
    <div class="checkbox-row" style="margin-bottom:.9rem;">
      <input type="checkbox" id="fd-verified"><label for="fd-verified" style="font-weight:400;" data-i18n="filter.verifiedOnly"></label>
    </div>
    <button class="btn btn-primary btn-sm" id="fd-search" data-i18n="common.search"></button>
  </div>
  <div class="agent-list" id="agent-list"></div>
</div>
<div id="site-footer"></div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  EDELALA.renderHeader('customer');
  EDELALA.renderFooter();
  const citySel = document.getElementById('fd-city');
  DB.CITIES.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=EDELALA.cityLabel(c); citySel.appendChild(o); });

  function renderAgent(a){
    const badge = a.verification.status==='APPROVED'
      ? `<span class="badge badge-verified">🟢 ${I18N.t('agentProfile.verified')}</span>`
      : `<span class="badge badge-neutral">${I18N.t('agentProfile.unverified')}</span>`;
    const stats = DB.agentStats(a.userId);
    return `<div class="agent-tile">
      <div class="top">
        <img src="${a.photo}" alt="">
        <div>
          <div style="font-weight:700;">${EDELALA.escapeHtml(a.businessName)}</div>
          <div class="text-soft" style="font-size:.85rem;">📍 ${EDELALA.cityLabel(a.city)}</div>
        </div>
      </div>
      ${badge}
      <div class="stats">
        <span>⭐ ${a.trustRating.toFixed(1)}</span>
        <span>${stats.totalListings} ${I18N.t('findDelala.listings')}</span>
        <span>${stats.completed} ${I18N.t('findDelala.completed')}</span>
      </div>
      <div class="cluster">
        <a class="btn btn-outline btn-sm" href="agent-profile.html?id=${a.userId}" data-i18n="findDelala.viewProfile"></a>
        <a class="btn btn-primary btn-sm" href="agent-profile.html?id=${a.userId}#task" data-i18n="findDelala.giveTask"></a>
      </div>
    </div>`;
  }

  function refresh(){
    const items = DB.listAgents({
      query: document.getElementById('fd-q').value.trim(),
      city: document.getElementById('fd-city').value,
      verifiedOnly: document.getElementById('fd-verified').checked
    }).sort((a,b)=>b.trustRating-a.trustRating);
    document.getElementById('agent-list').innerHTML = items.map(renderAgent).join('') || `<p class="text-soft" data-i18n="common.notFound"></p>`;
    I18N.applyTranslations();
  }
  document.getElementById('fd-search').addEventListener('click', refresh);
  document.addEventListener('edelala:langchange', refresh);
  refresh();
</script>
</body>
</html>
