<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Delala Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .profile-head{display:flex; gap:1.6rem; align-items:center; flex-wrap:wrap; padding:2rem 0; border-bottom:1px solid var(--mist-line); margin-bottom:2rem;}
  .profile-head img{width:96px;height:96px;border-radius:50%;object-fit:cover;}
  .profile-stats{display:flex; gap:1.6rem; flex-wrap:wrap; margin:.6rem 0;}
  .profile-stats .n{font-family:var(--font-display); font-weight:700; font-size:1.3rem; color:var(--violet-800,var(--violet-700));}
  .listing-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1.3rem;}
  .rec-box{background:var(--violet-50); border-radius:var(--radius-m); padding:1rem 1.2rem; margin-top:1rem; font-size:.9rem;}
  @media (max-width:900px){ .listing-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .listing-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap section-tight" id="root">
  <p class="text-soft" data-i18n="common.loading"></p>
</div>
<div id="site-footer"></div>

<div class="modal-overlay" id="task-modal" style="display:none;">
  <div class="modal">
    <h3 data-i18n="task.title"></h3>
    <form id="task-form" novalidate>
      <div class="field"><label data-i18n="request.name"></label><input type="text" id="tk-name" required></div>
      <div class="field"><label data-i18n="request.phone"></label><input type="tel" id="tk-phone" required></div>
      <div class="field">
        <label data-i18n="task.category"></label>
        <select id="tk-category">
          <option value="HOUSE" data-i18n="home.cat.houses"></option>
          <option value="VEHICLE" data-i18n="home.cat.vehicles"></option>
          <option value="MACHINERY" data-i18n="home.cat.machinery"></option>
          <option value="SERVICE" data-i18n="home.cat.services"></option>
        </select>
      </div>
      <div class="field"><label data-i18n="task.location"></label><input type="text" id="tk-location"></div>
      <div class="field"><label data-i18n="task.budget"></label><input type="number" id="tk-budget"></div>
      <div class="field"><label data-i18n="task.deadline"></label><input type="text" id="tk-deadline"></div>
      <div class="field"><label data-i18n="task.description"></label><textarea id="tk-desc"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close-modal data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="task.submit"></button>
      </div>
    </form>
  </div>
</div>

<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  EDELALA.renderHeader('customer');
  EDELALA.renderFooter();
  const id = EDELALA.qs('id');
  const agent = id ? DB.getAgentProfile(id) : null;
  const agentUser = agent ? DB.all().users.find(u=>u.id===agent.userId) : null;

  function renderListingCard(l){
    const img = l.images && l.images[0] ? l.images[0] : DB.placeholderImg(l.title);
    return `<a class="listing-card" href="listing.html?id=${l.id}">
      <div class="media"><img src="${img}" alt=""><span class="purpose-tag">${I18N.t(l.purpose==='RENT'?'filter.rent':'filter.sale')}</span></div>
      <div class="body">
        <div class="price">${EDELALA.formatETB(l.price)}</div>
        <div class="title">${EDELALA.escapeHtml(l.title)}</div>
      </div>
    </a>`;
  }

  function render(){
    const root = document.getElementById('root');
    if(!agent){
      root.innerHTML = `<div class="empty-state"><div class="icon">👤</div><p data-i18n="common.notFound"></p></div>`;
      I18N.applyTranslations(root); return;
    }
    const stats = DB.agentStats(agent.userId);
    const badge = agent.verification.status==='APPROVED'
      ? EDELALA.verifiedStampHtml()
      : `<span class="badge badge-neutral">${I18N.t('agentProfile.unverified')}</span>`;
    const listings = DB.listingsByAgent(agent.userId).filter(l=>l.status==='ACTIVE');

    root.innerHTML = `
      <div class="profile-head">
        <img src="${agent.photo}" alt="">
        <div style="flex:1;min-width:220px;">
          <h1 style="margin-bottom:.2rem;">${EDELALA.escapeHtml(agent.businessName)}</h1>
          <div class="text-soft">📍 ${EDELALA.cityLabel(agent.city)} · 📞 ${EDELALA.escapeHtml(agent.phone)}</div>
          <div class="profile-stats">
            <div><div class="n">${agent.trustRating.toFixed(1)}</div><div class="text-soft" style="font-size:.8rem;" data-i18n="agentProfile.rating"></div></div>
            <div><div class="n">${stats.totalListings}</div><div class="text-soft" style="font-size:.8rem;" data-i18n="agentProfile.listings"></div></div>
            <div><div class="n">${stats.completed}</div><div class="text-soft" style="font-size:.8rem;" data-i18n="agentProfile.completed"></div></div>
          </div>
          ${badge}
          ${agent.recommendation ? `<div class="rec-box"><strong data-i18n="agentProfile.recommendations"></strong><p style="margin:.3rem 0 0;">${EDELALA.escapeHtml(agent.recommendation)}</p></div>` : ''}
        </div>
        <div>
          <button class="btn btn-primary" id="task-btn" data-i18n="findDelala.giveTask"></button>
        </div>
      </div>
      <h3 data-i18n="agentProfile.listings"></h3>
      <div class="listing-grid">${listings.map(renderListingCard).join('') || `<p class="text-soft" data-i18n="common.notFound"></p>`}</div>
    `;
    I18N.applyTranslations(root);
    document.getElementById('task-btn').addEventListener('click', ()=>{
      const u = DB.currentUser();
      if(u && u.role==='CUSTOMER'){ document.getElementById('tk-name').value=u.fullName; document.getElementById('tk-phone').value=u.phone; }
      document.getElementById('task-modal').style.display='flex';
    });
  }

  document.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click', ()=>btn.closest('.modal-overlay').style.display='none'));

  document.getElementById('task-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const name = document.getElementById('tk-name').value.trim();
    const phone = document.getElementById('tk-phone').value.trim();
    if(!name || !phone){ EDELALA.toast(I18N.t('common.required'),'error'); return; }
    const u = DB.currentUser();
    DB.createTask({
      agentId: agent.userId, customerId: u ? u.id : null, name, phone,
      category: document.getElementById('tk-category').value,
      location: document.getElementById('tk-location').value.trim(),
      budget: Number(document.getElementById('tk-budget').value || 0),
      description: document.getElementById('tk-desc').value.trim(),
      deadline: document.getElementById('tk-deadline').value.trim()
    });
    document.getElementById('task-modal').style.display='none';
    document.getElementById('task-form').reset();
    EDELALA.toast(I18N.t('task.success'), 'success');
  });

  if(window.location.hash === '#task' && agent) document.addEventListener('DOMContentLoaded', ()=>{});
  document.addEventListener('edelala:langchange', render);
  render();
</script>
</body>
</html>
