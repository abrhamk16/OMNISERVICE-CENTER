<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Browse listings</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .browse-shell{display:grid; grid-template-columns:270px 1fr; gap:2rem; align-items:flex-start;}
  .filters{position:sticky; top:88px; border:1px solid var(--mist-line); border-radius:var(--radius-m); padding:1.3rem;}
  .results-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem; gap:1rem; flex-wrap:wrap;}
  .listing-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1.3rem;}
  .cat-pills{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.3rem;}
  .cat-pills button{border:1.5px solid var(--mist-line); background:#fff; border-radius:999px; padding:.5rem 1rem; font-weight:600; cursor:pointer; font-size:.88rem;}
  .cat-pills button.active{background:var(--violet-600); color:#fff; border-color:var(--violet-600);}
  .skel-card{height:280px; border-radius:var(--radius-m);}
  @media (max-width:900px){
    .browse-shell{grid-template-columns:1fr;}
    .filters{position:static;}
    .listing-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){ .listing-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap section-tight">
  <h1 data-i18n="nav.browse" style="margin-bottom:.3rem;"></h1>
  <div class="cat-pills" id="cat-pills">
    <button data-cat="" class="active" data-i18n="filter.all"></button>
    <button data-cat="HOUSE">🏠 <span data-i18n="home.cat.houses"></span></button>
    <button data-cat="VEHICLE">🚗 <span data-i18n="home.cat.vehicles"></span></button>
    <button data-cat="MACHINERY">🚜 <span data-i18n="home.cat.machinery"></span></button>
    <button data-cat="SERVICE">🧹 <span data-i18n="home.cat.services"></span></button>
  </div>

  <div class="browse-shell">
    <aside class="filters">
      <h3 data-i18n="filter.title" style="font-size:1.05rem;"></h3>
      <form id="filter-form">
        <div class="field">
          <label data-i18n="common.search"></label>
          <input type="text" id="f-query">
        </div>
        <div class="field">
          <label data-i18n="filter.location"></label>
          <select id="f-city">
            <option value="" data-i18n="filter.all"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="filter.purpose"></label>
          <select id="f-purpose">
            <option value="" data-i18n="filter.all"></option>
            <option value="RENT" data-i18n="filter.rent"></option>
            <option value="SALE" data-i18n="filter.sale"></option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="filter.price"></label>
          <div class="cluster">
            <input type="number" id="f-min" data-i18n-placeholder="filter.priceMin" style="width:48%;">
            <input type="number" id="f-max" data-i18n-placeholder="filter.priceMax" style="width:48%;">
          </div>
        </div>
        <div class="field">
          <label data-i18n="filter.rating"></label>
          <select id="f-rating">
            <option value="">—</option>
            <option value="4">4.0+</option>
            <option value="4.5">4.5+</option>
          </select>
        </div>
        <div class="checkbox-row" style="margin-bottom:1.1rem;">
          <input type="checkbox" id="f-verified">
          <label for="f-verified" style="font-weight:400;" data-i18n="filter.verifiedOnly"></label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-sm" data-i18n="filter.apply"></button>
        <button type="button" id="f-clear" class="btn btn-ghost btn-block btn-sm" data-i18n="filter.clear" style="margin-top:.5rem;"></button>
      </form>
    </aside>

    <div>
      <div class="results-head">
        <div id="results-count" class="text-soft"></div>
        <select id="f-sort" style="width:auto;">
          <option value="newest" data-i18n="filter.sort.newest"></option>
          <option value="priceLow" data-i18n="filter.sort.priceLow"></option>
          <option value="priceHigh" data-i18n="filter.sort.priceHigh"></option>
          <option value="rating" data-i18n="filter.sort.rating"></option>
        </select>
      </div>
      <div class="listing-grid" id="results"></div>
      <div class="empty-state" id="empty" style="display:none;">
        <div class="icon">🔍</div>
        <p data-i18n="common.notFound"></p>
      </div>
    </div>
  </div>
</div>
<div id="site-footer"></div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  EDELALA.renderHeader('customer');
  EDELALA.renderFooter();

  const citySel = document.getElementById('f-city');
  DB.CITIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = EDELALA.cityLabel(c);
    citySel.appendChild(o);
  });

  const params = new URLSearchParams(window.location.search);
  let state = {
    query: params.get('q') || '',
    category: params.get('category') || '',
    city: '', purpose: '', minPrice: '', maxPrice: '', minRating: '', verifiedOnly: false, sort: 'newest'
  };
  document.getElementById('f-query').value = state.query;

  function setActivePill(){
    document.querySelectorAll('#cat-pills button').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-cat') === state.category);
    });
  }

  function renderCard(l){
    const img = l.images && l.images[0] ? l.images[0] : DB.placeholderImg(l.title);
    const priceSuffix = (l.category==='HOUSE' && l.purpose==='RENT') ? I18N.t('listing.month') : '';
    const isFav = DB.currentUser() && DB.currentUser().role==='CUSTOMER' && DB.isFavorite(DB.currentUser().id, l.id);
    return `<div class="listing-card" style="position:relative;">
      <a href="listing.html?id=${l.id}" style="color:inherit;text-decoration:none;">
        <div class="media">
          <img src="${img}" alt="${EDELALA.escapeHtml(l.title)}">
          <span class="purpose-tag">${I18N.t(l.purpose==='RENT'?'filter.rent':'filter.sale')}</span>
        </div>
        <div class="body">
          <div class="price">${EDELALA.formatETB(l.price)}${priceSuffix}</div>
          <div class="title">${EDELALA.escapeHtml(l.title)}</div>
          <div class="meta">
            <span>${EDELALA.categoryIcon(l.category)} ${EDELALA.categoryLabel(l.category)}</span>
            <span>· 📍 ${EDELALA.cityLabel(l.city)}</span>
          </div>
          ${l.agent ? `<div class="meta">${l.agent.verification.status==='APPROVED' ? '🟢' : '⚪'} ${EDELALA.escapeHtml(l.agent.businessName)} · ⭐ ${l.agent.trustRating.toFixed(1)}</div>` : ''}
        </div>
      </a>
      <button class="fav-btn" data-fav-id="${l.id}" title="${I18N.t('listing.save')}">${isFav ? '❤️' : '🤍'}</button>
    </div>`;
  }

  function refresh(){
    setActivePill();
    const items = DB.listListings({
      query: state.query, category: state.category, city: state.city, purpose: state.purpose,
      minPrice: state.minPrice, maxPrice: state.maxPrice, minRating: state.minRating,
      verifiedOnly: state.verifiedOnly, sort: state.sort
    });
    document.getElementById('results-count').textContent = I18N.t('filter.results', { count: items.length });
    document.getElementById('results').innerHTML = items.map(renderCard).join('');
    document.getElementById('empty').style.display = items.length ? 'none' : 'block';

    document.querySelectorAll('.fav-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.preventDefault();
        const user = DB.currentUser();
        if(!user || user.role !== 'CUSTOMER'){ window.location.href = 'login.html'; return; }
        const isFav = DB.toggleFavorite(user.id, btn.getAttribute('data-fav-id'));
        btn.textContent = isFav ? '❤️' : '🤍';
        EDELALA.toast(isFav ? I18N.t('listing.saved') : I18N.t('listing.save'), 'success');
      });
    });
  }

  document.getElementById('cat-pills').addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    state.category = btn.getAttribute('data-cat');
    refresh();
  });

  document.getElementById('filter-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    state.query = document.getElementById('f-query').value.trim();
    state.city = document.getElementById('f-city').value;
    state.purpose = document.getElementById('f-purpose').value;
    state.minPrice = document.getElementById('f-min').value;
    state.maxPrice = document.getElementById('f-max').value;
    state.minRating = document.getElementById('f-rating').value;
    state.verifiedOnly = document.getElementById('f-verified').checked;
    refresh();
  });
  document.getElementById('f-clear').addEventListener('click', ()=>{
    document.getElementById('filter-form').reset();
    state = { query:'', category: state.category, city:'', purpose:'', minPrice:'', maxPrice:'', minRating:'', verifiedOnly:false, sort:'newest' };
    document.getElementById('f-sort').value = 'newest';
    refresh();
  });
  document.getElementById('f-sort').addEventListener('change', (e)=>{
    state.sort = e.target.value;
    refresh();
  });

  document.addEventListener('edelala:langchange', refresh);
  refresh();
</script>
</body>
</html>
