<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Admin: Delalas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>.filter-row{display:flex; gap:.8rem; margin-bottom:1.2rem; flex-wrap:wrap;} .filter-row input{max-width:280px;}</style>
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <h1 data-i18n="adminDelalas.title"></h1>
    <div class="filter-row">
      <input type="text" id="q" data-i18n-placeholder="adminDelalas.search">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-i18n="auth.fullName"></th><th data-i18n="filter.location"></th><th>Status</th>
          <th data-i18n="agentProfile.rating"></th><th data-i18n="agentProfile.listings"></th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('ADMIN');
  if(user){
    EDELALA.renderHeader('admin');
    EDELALA.renderDashSidebar('admin', 'delalas.html');
    const db0 = DB.all();

    function statusBadge(a){
      if(a.spam) return `<span class="badge badge-alert">SPAM</span>`;
      if(a.status==='SUSPENDED') return `<span class="badge badge-alert">${I18N.t('adminDelalas.suspend')}D</span>`;
      return a.verification.status==='APPROVED' ? `<span class="badge badge-verified">🟢 ${I18N.t('agentProfile.verified')}</span>` : `<span class="badge badge-neutral">${I18N.t('agentProfile.unverified')}</span>`;
    }

    function renderRow(a){
      const stats = DB.agentStats(a.userId);
      return `<tr>
        <td>${EDELALA.escapeHtml(a.businessName)}<div class="text-soft" style="font-size:.78rem;">${EDELALA.escapeHtml(a.user.fullName)}</div></td>
        <td>${EDELALA.cityLabel(a.city)}</td>
        <td>${statusBadge(a)}</td>
        <td>⭐ ${a.trustRating.toFixed(1)}</td>
        <td>${stats.totalListings}</td>
        <td>
          <div class="cluster">
            <a class="btn btn-outline btn-sm" href="../customer/agent-profile.html?id=${a.userId}" target="_blank" data-i18n="adminDelalas.view"></a>
            ${a.status==='ACTIVE' ? `<button class="btn btn-ghost btn-sm" data-suspend="${a.userId}" data-i18n="adminDelalas.suspend"></button>` : `<button class="btn btn-ghost btn-sm" data-reinstate="${a.userId}" data-i18n="adminDelalas.reinstate"></button>`}
            <button class="btn btn-ghost btn-sm" data-spam="${a.userId}" data-i18n="adminDelalas.markSpam"></button>
            <button class="btn btn-danger btn-sm" data-delete="${a.userId}" data-i18n="adminDelalas.delete"></button>
          </div>
        </td>
      </tr>`;
    }

    function refresh(){
      const q = document.getElementById('q').value.trim().toLowerCase();
      const db = DB.all();
      const items = db.agentProfiles
        .map(a => ({...a, user: db.users.find(u=>u.id===a.userId)}))
        .filter(a => !q || a.businessName.toLowerCase().includes(q) || (a.user && a.user.fullName.toLowerCase().includes(q)));
      document.getElementById('rows').innerHTML = items.map(renderRow).join('');
      I18N.applyTranslations();

      document.querySelectorAll('[data-suspend]').forEach(btn=>btn.addEventListener('click', async ()=>{
        if(await EDELALA.confirmDialog(I18N.t('adminDelalas.confirmSuspend'))){ DB.suspendAgent(btn.getAttribute('data-suspend')); refresh(); }
      }));
      document.querySelectorAll('[data-reinstate]').forEach(btn=>btn.addEventListener('click', ()=>{ DB.reinstateAgent(btn.getAttribute('data-reinstate')); refresh(); }));
      document.querySelectorAll('[data-spam]').forEach(btn=>btn.addEventListener('click', ()=>{ DB.markAgentSpam(btn.getAttribute('data-spam')); EDELALA.toast('Marked as spam.', 'success'); refresh(); }));
      document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click', async ()=>{
        if(await EDELALA.confirmDialog(I18N.t('adminDelalas.confirmDelete'))){ DB.deleteAgent(btn.getAttribute('data-delete')); refresh(); }
      }));
    }
    document.getElementById('q').addEventListener('input', refresh);
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
