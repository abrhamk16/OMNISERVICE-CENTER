<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Admin: Trust & Recommendations</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>.trust-card{border:1px solid var(--mist-line); border-radius:var(--radius-m); padding:1.2rem; margin-bottom:1rem; display:grid; grid-template-columns:1.2fr 1fr; gap:1.4rem;}
@media (max-width:800px){.trust-card{grid-template-columns:1fr;}}</style>
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <h1 data-i18n="adminTrust.title"></h1>
    <div id="list"></div>
  </main>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('ADMIN');
  if(user){
    EDELALA.renderHeader('admin');
    EDELALA.renderDashSidebar('admin', 'trust.html');

    function refresh(){
      const db = DB.all();
      document.getElementById('list').innerHTML = db.agentProfiles.map(a=>`
        <div class="trust-card">
          <div>
            <div style="font-weight:700;">${EDELALA.escapeHtml(a.businessName)}</div>
            <div class="text-soft" style="font-size:.85rem;">${EDELALA.cityLabel(a.city)} · current: ⭐ ${a.trustRating.toFixed(1)}</div>
            ${a.recommendation ? `<p class="text-soft" style="font-size:.85rem;margin-top:.5rem;">"${EDELALA.escapeHtml(a.recommendation)}"</p>` : ''}
          </div>
          <form data-agent="${a.userId}">
            <div class="field"><label data-i18n="adminTrust.setRating"></label><input type="number" step="0.1" min="0" max="5" value="${a.trustRating}" class="rating-input"></div>
            <div class="field"><label data-i18n="adminTrust.recommendation"></label><textarea class="rec-input">${EDELALA.escapeHtml(a.recommendation)}</textarea></div>
            <button type="submit" class="btn btn-primary btn-sm" data-i18n="adminTrust.save"></button>
          </form>
        </div>`).join('');
      I18N.applyTranslations();

      document.querySelectorAll('[data-agent]').forEach(form=>{
        form.addEventListener('submit', (e)=>{
          e.preventDefault();
          const rating = form.querySelector('.rating-input').value;
          const rec = form.querySelector('.rec-input').value.trim();
          DB.setTrust(form.getAttribute('data-agent'), rating, rec);
          EDELALA.toast(I18N.t('adminTrust.saved'), 'success');
          refresh();
        });
      });
    }
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
