<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .bar-chart{display:flex; align-items:flex-end; gap:.9rem; height:160px; margin-top:1rem;}
  .bar-chart .bar{flex:1; background:var(--violet-500); border-radius:6px 6px 0 0; position:relative; min-height:4px;}
  .bar-chart .bar span{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); font-size:.75rem; font-weight:700; margin-bottom:2px; white-space:nowrap;}
  .bar-chart .lbl{position:absolute; top:100%; left:50%; transform:translateX(-50%); font-size:.72rem; color:var(--ink-soft); margin-top:4px; white-space:nowrap;}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <h1 data-i18n="adminDash.title"></h1>
    <div class="stat-grid" id="stat-grid"></div>
    <div class="two-col" style="display:grid;grid-template-columns:1.3fr 1fr;gap:1.5rem;">
      <div class="card card-pad">
        <h3 data-i18n="adminDash.totalListings" style="margin-bottom:0;"></h3>
        <div class="bar-chart" id="bar-chart" style="margin-bottom:1.6rem;"></div>
      </div>
      <div class="card card-pad">
        <h3 data-i18n="adminDash.recentActivity"></h3>
        <div id="activity-list" style="font-size:.9rem;"></div>
      </div>
    </div>
  </main>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('ADMIN');
  if(user){
    EDELALA.renderHeader('admin');
    EDELALA.renderDashSidebar('admin', 'dashboard.html');

    function refresh(){
      const s = DB.dashboardStats();
      const cards = [
        ['adminDash.totalCustomers', s.totalCustomers],
        ['adminDash.totalDelalas', s.totalDelalas],
        ['adminDash.verifiedDelalas', s.verifiedDelalas],
        ['adminDash.pendingVerification', s.pendingVerification],
        ['adminDash.totalListings', s.totalListings],
        ['adminDash.activeListings', s.activeListings],
        ['adminDash.reports', s.reports],
        ['adminDash.requests', s.requests]
      ];
      document.getElementById('stat-grid').innerHTML = cards.map(([k,v])=>`<div class="stat-card"><div class="num">${v}</div><div class="label" data-i18n="${k}"></div></div>`).join('');

      const db = DB.all();
      const cats = ['HOUSE','VEHICLE','MACHINERY','SERVICE'];
      const counts = cats.map(c => db.listings.filter(l=>l.category===c && l.status==='ACTIVE').length);
      const max = Math.max(...counts, 1);
      document.getElementById('bar-chart').innerHTML = cats.map((c,i)=>`
        <div class="bar" style="height:${(counts[i]/max*100)||2}%;">
          <span>${counts[i]}</span>
          <span class="lbl">${EDELALA.categoryIcon(c)}</span>
        </div>`).join('');

      const recentReports = DB.allReports().slice(0,3);
      const recentReqs = DB.allRequests().slice(0,3);
      const items = [
        ...recentReports.map(r=>`🚩 ${I18N.t('report.reason.'+r.reason)} — ${r.listing?EDELALA.escapeHtml(r.listing.title):''} <span class="text-soft">(${EDELALA.timeAgo(r.createdAt)})</span>`),
        ...recentReqs.map(r=>`📨 ${EDELALA.escapeHtml(r.name)} → ${r.listing?EDELALA.escapeHtml(r.listing.title):''} <span class="text-soft">(${EDELALA.timeAgo(r.createdAt)})</span>`)
      ];
      document.getElementById('activity-list').innerHTML = items.map(i=>`<p style="margin:0 0 .7rem;">${i}</p>`).join('') || `<p class="text-soft" data-i18n="common.notFound"></p>`;
      I18N.applyTranslations();
    }
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
