<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Admin: Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>.settings-form{max-width:480px;}</style>
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <h1 data-i18n="adminSettings.title"></h1>
    <h3 data-i18n="adminSettings.general"></h3>
    <form id="settings-form" class="settings-form">
      <div class="field"><label data-i18n="adminSettings.siteName"></label><input type="text" id="s-name"></div>
      <div class="field"><label data-i18n="adminSettings.contactEmail"></label><input type="email" id="s-email"></div>
      <button class="btn btn-primary" type="submit" data-i18n="adminSettings.save"></button>
    </form>

    <h3 style="margin-top:2rem;" data-i18n="adminSettings.paymentTitle"></h3>
    <p class="text-soft" style="max-width:520px;" data-i18n="adminSettings.paymentSubtitle"></p>
    <form id="payment-form" class="settings-form">
      <div class="field"><label>Telebirr</label><input type="text" id="s-telebirr"></div>
      <div class="field"><label data-i18n="verification.cbeLabel"></label><input type="text" id="s-cbe"></div>
      <div class="field"><label data-i18n="adminSettings.feeAmount"></label><input type="number" id="s-fee" min="0"></div>
      <button class="btn btn-primary" type="submit" data-i18n="adminSettings.save"></button>
    </form>

    <h3 style="margin-top:2rem;" data-i18n="adminSettings.account"></h3>
    <form id="account-form" class="settings-form">
      <div class="field"><label data-i18n="auth.fullName"></label><input type="text" id="a-name"></div>
      <div class="field"><label data-i18n="auth.email"></label><input type="email" id="a-email" disabled></div>
      <button class="btn btn-outline" type="submit" data-i18n="adminSettings.changePassword"></button>
    </form>
  </main>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('ADMIN');
  if(user){
    EDELALA.renderHeader('admin');
    EDELALA.renderDashSidebar('admin', 'settings.html');
    const settings = DB.getSettings();
    document.getElementById('s-name').value = settings.siteName || 'E-Delala';
    document.getElementById('s-email').value = settings.contactEmail || '';
    document.getElementById('s-telebirr').value = settings.telebirrNumber || '';
    document.getElementById('s-cbe').value = settings.cbeAccount || '';
    document.getElementById('s-fee').value = settings.verificationFee || 500;
    document.getElementById('a-name').value = user.fullName;
    document.getElementById('a-email').value = user.email;

    document.getElementById('settings-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      DB.saveSettings({ siteName: document.getElementById('s-name').value.trim(), contactEmail: document.getElementById('s-email').value.trim() });
      EDELALA.toast(I18N.t('adminSettings.saved'), 'success');
    });
    document.getElementById('payment-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      DB.saveSettings({
        telebirrNumber: document.getElementById('s-telebirr').value.trim(),
        cbeAccount: document.getElementById('s-cbe').value.trim(),
        verificationFee: Number(document.getElementById('s-fee').value || 500)
      });
      EDELALA.toast(I18N.t('adminSettings.saved'), 'success');
    });
    document.getElementById('account-form').addEventListener('submit', (e)=>{
      e.preventDefault();
      EDELALA.toast('Password change is simulated in this demo build.', 'success');
    });
  }
</script>
</body>
</html>
