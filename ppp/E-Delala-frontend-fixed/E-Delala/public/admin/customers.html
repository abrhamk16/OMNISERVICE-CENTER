<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Admin: Customers</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <h1 data-i18n="adminCustomers.title"></h1>
    <div class="field" style="max-width:320px;"><input type="text" id="q" data-i18n-placeholder="adminCustomers.search"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th data-i18n="auth.fullName"></th><th data-i18n="auth.email"></th><th data-i18n="auth.phone"></th><th>Joined</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('ADMIN');
  if(user){
    EDELALA.renderHeader('admin');
    EDELALA.renderDashSidebar('admin', 'customers.html');
    function refresh(){
      const q = document.getElementById('q').value.trim().toLowerCase();
      const items = DB.allCustomers().filter(c=>!q || c.fullName.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
      document.getElementById('rows').innerHTML = items.map(c=>`<tr>
        <td>${EDELALA.escapeHtml(c.fullName)}</td><td>${EDELALA.escapeHtml(c.email)}</td><td>${EDELALA.escapeHtml(c.phone)}</td><td>${EDELALA.timeAgo(c.createdAt)}</td>
      </tr>`).join('');
      I18N.applyTranslations();
    }
    document.getElementById('q').addEventListener('input', refresh);
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
