<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — My Listings</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .listing-row{display:flex; gap:1rem; align-items:center; border:1px solid var(--mist-line); border-radius:var(--radius-m); padding:1rem; margin-bottom:.9rem;}
  .listing-row img{width:84px;height:64px;object-fit:cover;border-radius:var(--radius-s); flex-shrink:0;}
  .listing-row .info{flex:1; min-width:0;}
  .listing-row .actions{display:flex; gap:.5rem; flex-shrink:0;}
  .head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; flex-wrap:wrap; gap:.8rem;}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <div class="head-row">
      <h1 data-i18n="myListings.title" style="margin:0;"></h1>
      <a class="btn btn-primary" href="add-listing.html" data-i18n="myListings.add"></a>
    </div>
    <div id="listing-list"></div>
    <div class="empty-state" id="empty" style="display:none;">
      <div class="icon">🏷️</div>
      <p data-i18n="myListings.empty"></p>
      <a class="btn btn-primary" href="add-listing.html" data-i18n="myListings.emptyCta"></a>
    </div>
  </main>
</div>

<div class="modal-overlay" id="comments-modal" style="display:none;">
  <div class="modal" style="max-width:520px;">
    <h3 data-i18n="listing.reviews"></h3>
    <div id="comments-modal-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close-modal data-i18n="common.close"></button>
    </div>
  </div>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('AGENT');
  if(user){
    EDELALA.renderHeader('agent');
    EDELALA.renderDashSidebar('agent', 'listings.html');

    function renderRow(l){
      const img = l.images && l.images[0] ? l.images[0] : DB.placeholderImg(l.title);
      const statusBadge = l.status==='ACTIVE' ? `<span class="badge badge-verified">${I18N.t('myListings.status.ACTIVE')}</span>` : `<span class="badge badge-alert">${I18N.t('myListings.status.REMOVED')}</span>`;
      return `<div class="listing-row">
        <img src="${img}" alt="">
        <div class="info">
          <div style="font-weight:700;">${EDELALA.escapeHtml(l.title)}</div>
          <div class="text-soft" style="font-size:.85rem;">${EDELALA.categoryIcon(l.category)} ${EDELALA.categoryLabel(l.category)} · ${EDELALA.formatETB(l.price)} · 📍 ${EDELALA.cityLabel(l.city)}</div>
          <div style="margin-top:.3rem;">${statusBadge}</div>
        </div>
        <div class="actions">
          <a class="btn btn-outline btn-sm" href="../customer/listing.html?id=${l.id}" target="_blank">👁</a>
          <button class="btn btn-outline btn-sm" data-comments="${l.id}">💬 ${DB.commentsForListing(l.id).length}</button>
          <button class="btn btn-danger btn-sm" data-del="${l.id}" data-i18n="myListings.delete"></button>
        </div>
      </div>`;
    }

    async function refresh(){
      const items = DB.listingsByAgent(user.id).filter(l=>l.status!=='REMOVED');
      document.getElementById('listing-list').innerHTML = items.map(renderRow).join('');
      document.getElementById('empty').style.display = items.length ? 'none' : 'block';
      I18N.applyTranslations();
      document.querySelectorAll('[data-del]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const ok = await EDELALA.confirmDialog(I18N.t('myListings.confirmDelete'));
          if(ok){ DB.deleteListing(btn.getAttribute('data-del')); EDELALA.toast(I18N.t('myListings.deleted'), 'success'); refresh(); }
        });
      });
      document.querySelectorAll('[data-comments]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const listingId = btn.getAttribute('data-comments');
          const comments = DB.commentsForListing(listingId);
          const body = document.getElementById('comments-modal-body');
          body.innerHTML = comments.map(c=>`
            <div style="border:1px solid var(--mist-line);border-radius:var(--radius-s);padding:.8rem;margin-bottom:.6rem;">
              <div class="cluster" style="justify-content:space-between;">
                <strong>${EDELALA.escapeHtml(c.customerName)}</strong>
                <span style="color:#D9A441;">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</span>
              </div>
              <p style="margin:.4rem 0 0;">${EDELALA.escapeHtml(c.comment)}</p>
              <div class="text-soft" style="font-size:.78rem;margin-top:.3rem;">${EDELALA.timeAgo(c.createdAt)}</div>
            </div>`).join('') || `<p class="text-soft" data-i18n="listing.noReviews"></p>`;
          I18N.applyTranslations(body);
          document.getElementById('comments-modal').style.display = 'flex';
        });
      });
    }
    document.querySelectorAll('[data-close-modal]').forEach(btn=>{
      btn.addEventListener('click', ()=>btn.closest('.modal-overlay').style.display='none');
    });
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
