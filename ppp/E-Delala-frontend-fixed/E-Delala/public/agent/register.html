<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Become a Delala</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
</head>
<body>
<div id="site-header"></div>
<div class="auth-shell">
  <div class="auth-card">
    <h2 data-i18n="auth.register.title"></h2>
    <p class="text-soft" style="margin-bottom:1.2rem;" data-i18n="auth.asAgent"></p>
    <form id="register-form" novalidate>
      <div class="field"><label data-i18n="auth.fullName"></label><input type="text" id="fullName" required autocomplete="name"></div>
      <div class="field"><label data-i18n="auth.email"></label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label data-i18n="auth.phone"></label><input type="tel" id="phone" required autocomplete="tel"></div>
      <div class="field"><label data-i18n="auth.password"></label><input type="password" id="password" required minlength="6" autocomplete="new-password"></div>
      <div class="field"><label data-i18n="auth.confirmPassword"></label><input type="password" id="confirmPassword" required autocomplete="new-password"></div>
      <div class="checkbox-row" style="margin-bottom:1.2rem;">
        <input type="checkbox" id="agree" required>
        <label for="agree" style="font-weight:400;" data-i18n="auth.agree"></label>
      </div>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="nav.register"></button>
    </form>
    <p class="text-soft" style="font-size:.82rem;margin-top:.8rem;">You can register and start listing right away — verification badge comes later.</p>
    <p style="margin-top:.6rem;text-align:center;font-size:.9rem;">
      <span data-i18n="auth.haveAccount"></span>
      <a href="login.html" style="color:var(--violet-700);font-weight:600;text-decoration:none;" data-i18n="nav.login"></a>
    </p>
    <p style="text-align:center;"><a href="../index.html" class="text-soft" style="font-size:.85rem;" data-i18n="common.backHome"></a></p>
  </div>
</div>
<div id="site-footer"></div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  EDELALA.renderHeader('agent');
  EDELALA.renderFooter();
  EDELALA.setupRegister('AGENT', 'login.html');
</script>
</body>
</html>
