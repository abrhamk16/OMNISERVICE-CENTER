<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Delala — Customer Requests</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  .req-card{border:1px solid var(--mist-line); border-radius:var(--radius-m); padding:1.2rem; margin-bottom:1rem;}
  .req-top{display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
  .req-actions{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.9rem;}
</style>
</head>
<body>
<div id="site-header"></div>
<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"></aside>
  <main class="dash-main">
    <h1 data-i18n="agentRequests.title"></h1>
    <div id="req-list"></div>
    <div class="empty-state" id="empty" style="display:none;"><div class="icon">📨</div><p data-i18n="agentRequests.empty"></p></div>
  </main>
</div>
<script src="../js/i18n/en.js"></script>
<script src="../js/i18n/am.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/store.js"></script>
<script src="../js/app.js"></script>
<script>
  const user = EDELALA.guardRole('AGENT');
  if(user){
    EDELALA.renderHeader('agent');
    EDELALA.renderDashSidebar('agent', 'requests.html');

    function statusBadge(status){
      const cls = { NEW:'badge-neutral', CONTACTED:'badge-pending', IN_PROGRESS:'badge-pending', COMPLETED:'badge-verified', CANCELLED:'badge-alert' }[status] || 'badge-neutral';
      return `<span class="badge ${cls}">${I18N.t('request.status.'+status)}</span>`;
    }

    function actionsFor(r){
      const btns = [];
      if(r.status !== 'CANCELLED' && r.status !== 'COMPLETED'){
        btns.push(`<a class="btn btn-outline btn-sm" href="tel:${r.phone}" data-i18n="agentRequests.call"></a>`);
      }
      if(r.status === 'NEW') btns.push(`<button class="btn btn-ghost btn-sm" data-status="CONTACTED" data-id="${r.id}" data-i18n="agentRequests.markContacted"></button>`);
      if(r.status === 'CONTACTED') btns.push(`<button class="btn btn-ghost btn-sm" data-status="IN_PROGRESS" data-id="${r.id}" data-i18n="agentRequests.markInProgress"></button>`);
      if(r.status === 'IN_PROGRESS') btns.push(`<button class="btn btn-primary btn-sm" data-status="COMPLETED" data-id="${r.id}" data-i18n="agentRequests.complete"></button>`);
      if(r.status !== 'COMPLETED' && r.status !== 'CANCELLED') btns.push(`<button class="btn btn-danger btn-sm" data-status="CANCELLED" data-id="${r.id}" data-i18n="agentRequests.cancel"></button>`);
      return btns.join('');
    }

    function refresh(){
      const items = DB.requestsByAgent(user.id);
      document.getElementById('req-list').innerHTML = items.map(r=>`
        <div class="req-card">
          <div class="req-top">
            <div>
              <div style="font-weight:700;">${EDELALA.escapeHtml(r.name)} · ${EDELALA.escapeHtml(r.phone)}</div>
              <div class="text-soft" style="font-size:.85rem;">${r.listing ? EDELALA.escapeHtml(r.listing.title) : ''} · ${EDELALA.timeAgo(r.createdAt)}</div>
            </div>
            ${statusBadge(r.status)}
          </div>
          <p style="margin:.7rem 0 0;">${EDELALA.escapeHtml(r.description || '—')}</p>
          ${r.preferredTime ? `<p class="text-soft" style="font-size:.85rem;">🕓 ${EDELALA.escapeHtml(r.preferredTime)}</p>` : ''}
          <div class="req-actions">${actionsFor(r)}</div>
        </div>`).join('');
      document.getElementById('empty').style.display = items.length ? 'none' : 'block';
      I18N.applyTranslations();
      document.querySelectorAll('[data-status]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          DB.updateRequestStatus(btn.getAttribute('data-id'), btn.getAttribute('data-status'));
          EDELALA.toast(I18N.t('agentRequests.updated'), 'success');
          refresh();
        });
      });
    }
    document.addEventListener('edelala:langchange', refresh);
    refresh();
  }
</script>
</body>
</html>
